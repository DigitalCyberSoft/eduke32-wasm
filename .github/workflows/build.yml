name: Build & Release (web + native)

# Web build is the fork's shippable product (WASM, runs on any browser on
# Mac/Windows/Linux). Native jobs build the SAME game as a desktop binary with a
# real libdatachannel WebRTC/Nostr transport (net_transport_native.cpp), gated
# NETNATIVE=1 -- wire-compatible with the browser, so native <-> browser peers
# interoperate. The Linux job builds green (verified locally on Fedora 42: the
# stream-mode netcode is #if defined(__EMSCRIPTEN__) || defined(NETNATIVE)).
# macOS/Windows build libdatachannel (and, on Windows, libsecp256k1) from
# source -- neither is packaged by Homebrew or MSYS2. All native jobs are
# non-blocking so a runner hiccup never holds back the web release.
#
# Push a tag like v0.1.0 to cut a Release with the web bundle attached; every
# push to the integration branch just builds + uploads artifacts.

on:
  push:
    branches: [master, integration-merge, wasm]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # create Releases

jobs:
  # ---- WASM / web build (the working product) ---------------------------------
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.5
          actions-cache-folder: emsdk-cache
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build multiplayer transport bundle
        working-directory: platform/emscripten
        run: npm ci && npm test && npm run build:net
      - name: Verify bundled shareware fixture
        run: sha256sum -c assets/shareware/SHA256SUMS
      - name: Build WASM (software renderer, NetDuke32 multiplayer)
        run: make PLATFORM=EMSCRIPTEN EM_SINGLE_FILE=0 NETDUKE32=1 -j"$(nproc)"
      - name: Assemble web bundle
        run: |
          mkdir -p eduke32-wasm-web
          cp eduke32.js eduke32.wasm eduke32.data eduke32-wasm-web/
          cp platform/emscripten/index.html eduke32-wasm-web/index.html
          cp platform/emscripten/eduke32-net.js eduke32-wasm-web/eduke32-net.js
          cp platform/emscripten/grp-manifest.json eduke32-wasm-web/grp-manifest.json 2>/dev/null || true
          BUILD_ID="${{ github.run_number }}-$(git rev-parse --short HEAD)"
          sed -i "s/__BUILD_ID__/${BUILD_ID}/g" eduke32-wasm-web/index.html
          zip -r eduke32-wasm-web.zip eduke32-wasm-web
      - name: Upload web bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: eduke32-wasm-web
          path: eduke32-wasm-web.zip

  # ---- Native desktop builds: real WebRTC/Nostr multiplayer (NETNATIVE=1) ------
  # net_transport_native.cpp is libdatachannel (WebRTC data channels) + a C++
  # Nostr signaling client, wire-compatible with the browser transport, so a
  # native peer and a browser peer interoperate. These jobs build the full
  # native binary. Non-blocking (continue-on-error) while the last native-compat
  # wrinkles are ironed out, so they never gate the web release.

  native-linux:
    name: native (linux)
    runs-on: ubuntu-latest
    container: fedora:latest        # libdatachannel-devel etc. ship in Fedora's repos (Ubuntu apt lacks it)
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          dnf -y install gcc-c++ make git which \
            SDL2-devel SDL2_mixer-devel alsa-lib-devel \
            libdatachannel-devel libsecp256k1-devel miniupnpc-devel openssl-devel \
            libcurl-devel flac-devel libvorbis-devel
      - name: Build (NETNATIVE=1)
        run: make NETNATIVE=1 NETDUKE32=1 USE_LIBVPX=0 RENDERTYPE=SDL SDL_TARGET=2 -j"$(nproc)"
      - name: Package
        if: success()
        run: |
          mkdir -p eduke32-native-linux
          cp eduke32 mapster32 eduke32-native-linux/ 2>/dev/null || true
          sha256sum -c assets/shareware/SHA256SUMS
          cp assets/shareware/DUKE3D.GRP assets/shareware/LICENSE.TXT eduke32-native-linux/
          ls -la eduke32-native-linux/
      - uses: actions/upload-artifact@v4
        if: success()
        with: { name: eduke32-native-linux, path: eduke32-native-linux }

  native-macos:
    name: native (macos)
    runs-on: macos-latest
    continue-on-error: true
    env:
      LIBDATACHANNEL_TAG: v0.24.5
    steps:
      - uses: actions/checkout@v4
      - name: Install deps (Homebrew)
        # secp256k1 is the formula name (installs libsecp256k1.pc); there is NO
        # libdatachannel formula -- it is built from source below.
        run: brew install sdl2 sdl2_mixer secp256k1 miniupnpc openssl@3 flac libvorbis pkg-config cmake ninja
      - name: Cache libdatachannel
        id: cache-ldc
        uses: actions/cache@v4
        with:
          path: ~/ldc-prefix
          key: ldc-macos-${{ env.LIBDATACHANNEL_TAG }}
      - name: Build libdatachannel from source (no Homebrew formula exists)
        if: steps.cache-ldc.outputs.cache-hit != 'true'
        # NO_MEDIA: data channels only (all this transport uses) -- drops the
        # vendored libsrtp whose -Werror build breaks on newer toolchains.
        run: |
          git clone --depth 1 --branch "$LIBDATACHANNEL_TAG" --recurse-submodules --shallow-submodules \
            https://github.com/paullouisageneau/libdatachannel ldc-src
          cmake -S ldc-src -B ldc-src/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DNO_EXAMPLES=ON -DNO_TESTS=ON -DNO_MEDIA=ON \
            -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)" \
            -DCMAKE_INSTALL_PREFIX="$HOME/ldc-prefix"
          cmake --build ldc-src/build -j"$(sysctl -n hw.ncpu)"
          cmake --install ldc-src/build
      - name: Build (NETNATIVE=1)
        # Stage libdatachannel into the brew prefix -- the makefile already
        # searches it (-I/-L) -- and put keg-only openssl@3's libcrypto.pc on
        # PKG_CONFIG_PATH for the pkg-config probe. No make-variable overrides:
        # command-line CXXFLAGS would REPLACE the makefile's own flags.
        run: |
          cp -R "$HOME/ldc-prefix/include/." "$(brew --prefix)/include/"
          cp -R "$HOME/ldc-prefix/lib/." "$(brew --prefix)/lib/"
          export PKG_CONFIG_PATH="$(brew --prefix openssl@3)/lib/pkgconfig:$PKG_CONFIG_PATH"
          make NETNATIVE=1 NETDUKE32=1 USE_LIBVPX=0 RENDERTYPE=SDL SDL_TARGET=2 -j"$(sysctl -n hw.ncpu)"
      - name: Package
        if: success()
        run: |
          mkdir -p eduke32-native-macos
          cp -R EDuke32.app eduke32 mapster32 eduke32-native-macos/ 2>/dev/null || true
          cp "$HOME/ldc-prefix/lib/"libdatachannel*.dylib eduke32-native-macos/ 2>/dev/null || true
          shasum -a 256 -c assets/shareware/SHA256SUMS
          cp assets/shareware/DUKE3D.GRP assets/shareware/LICENSE.TXT eduke32-native-macos/
          ls -la eduke32-native-macos/
      - uses: actions/upload-artifact@v4
        if: success()
        with: { name: eduke32-native-macos, path: eduke32-native-macos }

  native-windows:
    name: native (windows)
    runs-on: windows-latest
    continue-on-error: true
    env:
      LIBDATACHANNEL_TAG: v0.24.5
      SECP256K1_TAG: v0.8.0
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          # MSYS2 packages NEITHER libdatachannel NOR libsecp256k1 -- both are
          # built from source below and installed into the MINGW64 prefix.
          install: >-
            mingw-w64-x86_64-toolchain mingw-w64-x86_64-SDL2 mingw-w64-x86_64-SDL2_mixer
            mingw-w64-x86_64-miniupnpc mingw-w64-x86_64-openssl mingw-w64-x86_64-curl
            mingw-w64-x86_64-flac mingw-w64-x86_64-libvorbis
            mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja make git
      - name: Cache source-built deps
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: deps-prefix
          key: win-deps-${{ env.LIBDATACHANNEL_TAG }}-${{ env.SECP256K1_TAG }}
      - name: Build libdatachannel + libsecp256k1 from source
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          PREFIX="$PWD/deps-prefix"
          git clone --depth 1 --branch "$LIBDATACHANNEL_TAG" --recurse-submodules --shallow-submodules \
            https://github.com/paullouisageneau/libdatachannel ldc-src
          cmake -S ldc-src -B ldc-src/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DNO_EXAMPLES=ON -DNO_TESTS=ON -DNO_MEDIA=ON \
            -DCMAKE_INSTALL_PREFIX="$PREFIX"
          cmake --build ldc-src/build -j"$(nproc)"
          cmake --install ldc-src/build
          git clone --depth 1 --branch "$SECP256K1_TAG" https://github.com/bitcoin-core/secp256k1 secp-src
          cmake -S secp-src -B secp-src/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$PREFIX" \
            -DSECP256K1_ENABLE_MODULE_SCHNORRSIG=ON -DSECP256K1_ENABLE_MODULE_EXTRAKEYS=ON \
            -DSECP256K1_BUILD_TESTS=OFF -DSECP256K1_BUILD_BENCHMARK=OFF -DSECP256K1_BUILD_EXHAUSTIVE_TESTS=OFF
          cmake --build secp-src/build -j"$(nproc)"
          cmake --install secp-src/build
      - name: Build (NETNATIVE=1)
        # Stage the source-built deps into the MINGW64 prefix (default search
        # paths for compiler, linker, and pkg-config alike). No make-variable
        # overrides: command-line CXXFLAGS would REPLACE the makefile's own.
        #
        # secp256k1's CMake install ships NO libsecp256k1.pc (autotools does;
        # brew's mac formula has one) -- and the makefile queries all three libs
        # in ONE pkg-config call, so a single missing .pc silently drops
        # -lsecp256k1 -lminiupnpc -lcrypto together and the link fails 5000
        # lines later. Synthesize the .pc, then probe loudly so a regression
        # dies HERE with a readable message.
        run: |
          cp -R deps-prefix/. /mingw64/
          if ! pkg-config --exists libsecp256k1; then
            mkdir -p /mingw64/lib/pkgconfig
            printf '%s\n' \
              'prefix=/mingw64' \
              'exec_prefix=${prefix}' \
              'libdir=${exec_prefix}/lib' \
              'includedir=${prefix}/include' \
              '' \
              'Name: libsecp256k1' \
              'Description: Optimized C library for EC operations on curve secp256k1 (source-built)' \
              "Version: ${SECP256K1_TAG#v}" \
              'Libs: -L${libdir} -lsecp256k1' \
              'Cflags: -I${includedir}' \
              > /mingw64/lib/pkgconfig/libsecp256k1.pc
            echo "synthesized libsecp256k1.pc"
          fi
          pkg-config --libs libsecp256k1 miniupnpc libcrypto libcurl
          ls /mingw64/lib/libdatachannel* /mingw64/lib/libsecp256k1* /mingw64/bin/libdatachannel*.dll
          make NETNATIVE=1 NETDUKE32=1 USE_LIBVPX=0 -j"$(nproc)"
      - name: Package (binary + runtime DLLs)
        if: success()
        run: |
          mkdir -p eduke32-native-windows
          cp eduke32.exe mapster32.exe eduke32-native-windows/ 2>/dev/null || true
          sha256sum -c assets/shareware/SHA256SUMS
          cp assets/shareware/DUKE3D.GRP assets/shareware/LICENSE.TXT eduke32-native-windows/
          cp deps-prefix/bin/*.dll eduke32-native-windows/ 2>/dev/null || true
          # mingw runtime DLLs the exe links (SDL2, openssl, curl, gcc runtime...)
          for f in $(ldd eduke32.exe | awk '/mingw64/ {print $3}' | sort -u); do cp "$f" eduke32-native-windows/; done
          ls -la eduke32-native-windows/
      - uses: actions/upload-artifact@v4
        if: success()
        with: { name: eduke32-native-windows, path: eduke32-native-windows }

  # ---- Release (on a v* tag): attach whatever built --------------------------
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    # Wait for the native jobs too (they're continue-on-error, so a failure
    # doesn't block the release) -- then attach whatever binaries built.
    needs: [web, native-linux, native-macos, native-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Package release assets (one archive per platform)
        # Release assets are FLAT files: the linux and mac artifacts both
        # contain "eduke32"/"mapster32" (basename collision), Windows is ~25
        # loose DLLs, and upload-artifact strips unix exec bits -- so restore
        # +x and roll one archive per platform. tar.gz for unix (keeps modes),
        # zip for Windows.
        run: |
          mkdir -p assets
          cp dist/eduke32-wasm-web/eduke32-wasm-web.zip assets/ 2>/dev/null || true
          if [ -d dist/eduke32-native-linux ]; then
            chmod +x dist/eduke32-native-linux/eduke32 dist/eduke32-native-linux/mapster32 2>/dev/null || true
            tar -C dist -czf assets/eduke32-native-linux-x86_64.tar.gz eduke32-native-linux
          fi
          if [ -d dist/eduke32-native-macos ]; then
            chmod +x dist/eduke32-native-macos/eduke32 dist/eduke32-native-macos/mapster32 2>/dev/null || true
            [ -d dist/eduke32-native-macos/EDuke32.app/Contents/MacOS ] && chmod +x dist/eduke32-native-macos/EDuke32.app/Contents/MacOS/* || true
            tar -C dist -czf assets/eduke32-native-macos-arm64.tar.gz eduke32-native-macos
          fi
          if [ -d dist/eduke32-native-windows ]; then
            (cd dist && zip -r ../assets/eduke32-native-windows-x86_64.zip eduke32-native-windows)
          fi
          ls -la assets/
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          generate_release_notes: true
          body: |
            eduke32-wasm ${{ github.ref_name }}

            **Web build** (`eduke32-wasm-web.zip`): the browser/WASM Duke3D with
            serverless WebRTC+Nostr P2P multiplayer -- runs on macOS/Windows/Linux
            via any browser. Also live on [GitHub Pages](https://digitalcybersoft.github.io/eduke32-wasm/).

            **Native desktop builds** (Linux x86_64, macOS arm64, Windows x86_64)
            carry the SAME serverless WebRTC+Nostr multiplayer via a native
            libdatachannel transport, wire-compatible with the browser
            (native <-> browser interop; either side can host). The Windows zip
            bundles its DLLs; on Linux/macOS run the binary from the archive
            (`./eduke32`). Playable out of the box: the browser build bakes the
            shareware episode in and every native archive ships the shareware
            DUKE3D.GRP beside the binary (a bare binary with no game data
            self-downloads it, checksum-pinned). For the full game, drop your
            own retail DUKE3D.GRP beside the binary. No retail data included.
