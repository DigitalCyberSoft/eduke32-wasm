<!DOCTYPE html>
<!--
  GitHub Pages host page for the EDuke32 WebAssembly build (multi-file:
  eduke32.js + eduke32.wasm + eduke32.data, all served beside this page).
  Shows a resource loading screen while the wasm + game data download, then
  hands off to the engine. Serve over HTTP(S); Web Audio unlocks on first click.

  MULTIPLAYER (eduke32-net): a single deferred module script (eduke32-net.js,
  built by platform/emscripten esbuild) adds window.DukeNet — the WebRTC+Nostr
  transport. It is independent of the wasm build and does NOT touch the boot,
  loader, 4:3 letterbox, or preRun cfg logic below. The only boot hook it adds is
  applyNetGrpChoice() in preRun, which relaunches on a previously DOWNLOADED GRP
  and is a strict no-op on a normal boot.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Duke Nukem 3D (WebAssembly)</title>
<style>
  :root { --duke-yellow:#f2c400; --duke-red:#c0281c; }
  html, body { margin:0; height:100%; background:#000; overflow:hidden; font-family:"Trebuchet MS",Verdana,sans-serif; }
  /* Center the 4:3 game surface; the black page background shows through as the
     left/right (or top/bottom) margins. Canvas display size is set by fitCanvas(). */
  body { display:flex; align-items:center; justify-content:center; }
  #canvas { display:block; image-rendering:pixelated; outline:none; background:#000; }
  #loader {
    position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:radial-gradient(120% 120% at 50% 30%, #241a12 0%, #0a0805 70%, #000 100%);
    color:#d8ccbf; z-index:10; transition:opacity .6s ease; text-align:center; padding:24px;
  }
  #loader.hidden { opacity:0; pointer-events:none; }
  #title { font-weight:900; letter-spacing:.06em; line-height:.92; text-transform:uppercase; }
  #title .a { color:var(--duke-yellow); font-size:clamp(34px,7vw,72px); text-shadow:0 2px 0 #7a5b00, 0 0 24px rgba(242,196,0,.25); }
  #title .b { color:var(--duke-yellow); font-size:clamp(20px,4vw,40px); }
  #bar { width:min(420px,72vw); height:16px; margin-top:34px; border:2px solid #4a3a22; border-radius:9px;
         background:#120d08; box-shadow:inset 0 0 8px #000; overflow:hidden; }
  #fill { height:100%; width:0%; border-radius:7px; transition:width .25s ease;
          background:linear-gradient(90deg,#7a1b12,var(--duke-red) 60%,#ff5a3c); }
  #status { margin-top:14px; font-size:14px; color:#a89a88; min-height:1.2em; letter-spacing:.03em; }
  #hint { margin-top:26px; font-size:12px; color:#6f6456; }
  #err { color:#ff7a5c; max-width:640px; font-size:13px; white-space:pre-wrap; }

  /* --- Web-wrapper settings panel (separate from the in-game menu) --- */
  #gear, #mute { position:fixed; top:12px; right:12px; z-index:20; width:40px; height:40px; border-radius:8px;
    border:1px solid #3a3a42; background:rgba(20,20,24,.7); color:#e8e2d6; font-size:20px; line-height:1; cursor:pointer;
    display:none; align-items:center; justify-content:center; }
  #gear:hover, #mute:hover { background:rgba(42,42,50,.92); }
  #mute { right:60px; }
  #mute.muted { opacity:.55; }
  #diag { position:fixed; top:10px; left:10px; z-index:15; font-family:monospace; font-size:12px; color:#9effa0;
    background:rgba(0,0,0,.5); padding:4px 8px; border-radius:6px; display:none; white-space:pre; pointer-events:none; }
  #settings { position:fixed; inset:0; z-index:30; display:none; align-items:center; justify-content:center;
    background:rgba(0,0,0,.55); font-family:"DejaVu Sans Mono",Menlo,Consolas,monospace; }
  #settings.open { display:flex; }
  #settings .panel { width:min(560px,92vw); max-height:88vh; overflow:auto; background:#141417; border:1px solid #2c2c33;
    border-radius:14px; padding:22px 24px; color:#c9c3b6; box-shadow:0 20px 60px rgba(0,0,0,.6); }
  #settings h3 { margin:0 0 6px; font-size:16px; font-weight:700; }
  #settings h3 .brand { color:var(--duke-yellow); }
  #settings h3 .ver { color:#6f6a5f; font-weight:400; font-size:12px; margin-left:8px; }
  #settings section { margin:16px 0; }
  #settings h4 { margin:0 0 9px; font-size:11px; letter-spacing:.09em; text-transform:uppercase; color:#8a8479; }
  #settings .row { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  #settings button.s { border:1px solid #3a3a42; background:#1b1b20; color:#e8e2d6; padding:8px 14px; border-radius:8px; cursor:pointer; font:inherit; }
  #settings button.s:hover { background:#26262d; }
  #settings button.s.on { border-color:var(--duke-yellow); color:var(--duke-yellow); }
  #settings button.danger { border-color:#6a2a24; color:#e08a80; }
  #settings button.danger:hover { background:#2a1614; }
  #settings ul#grplist { list-style:none; margin:0; padding:0; }
  #settings #grplist li { display:flex; justify-content:space-between; gap:12px; padding:8px 11px; background:#0f0f12;
    border:1px solid #24242a; border-radius:7px; margin-bottom:6px; font-size:13px; }
  #settings #grplist .gname { color:#e8e2d6; } #settings #grplist .gid { color:var(--duke-yellow); font-size:12px; }
  #settings #grplist .gsz { color:#7a756a; white-space:nowrap; }
  #settings #grplist li.empty { color:#7a756a; justify-content:flex-start; }
  #settings input[type=range] { accent-color:var(--duke-red); flex:1; min-width:120px; }
  #settings label.chk { cursor:pointer; display:inline-flex; align-items:center; gap:8px; }
  #settings .foot { margin-top:20px; padding-top:14px; border-top:1px solid #24242a; display:flex;
    justify-content:space-between; align-items:center; color:#6f6a5f; font-size:12px; }
  #settings .foot button { border:1px solid #3a3a42; background:#1b1b20; color:#e8e2d6; padding:8px 20px; border-radius:8px; cursor:pointer; font:inherit; }
  #settings .foot button:hover { background:#26262d; }
</style>
</head>
<body>
<canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
<div id="loader">
  <div id="title"><div class="a">Duke Nukem</div><div class="b">3D</div></div>
  <div id="bar"><div id="fill"></div></div>
  <div id="status">Loading&hellip;</div>
  <div id="hint">Click to capture the mouse &middot; Esc to release</div>
  <div id="err"></div>
</div>
<button id="gear" title="Settings" aria-label="Settings">&#9881;</button>
<button id="mute" title="Sound on/off" aria-label="Sound on/off">&#128266;</button>
<div id="diag"></div>
<div id="settings" role="dialog" aria-modal="true">
  <div class="panel">
    <h3><span class="brand">eduke32</span>-wasm <span class="ver" id="ver">Duke Nukem 3D &middot; WebAssembly</span> <span class="ver" id="build">build __BUILD_ID__</span></h3>
    <section>
      <h4>Loaded GRP files</h4>
      <ul id="grplist"><li class="empty">&hellip;</li></ul>
      <div class="row" style="margin-top:8px">
        <button class="s" id="btnAddGrp">Add game data&hellip;</button>
        <span id="grpAddNote" style="color:#7a756a;font-size:12px"></span>
      </div>
      <div class="row" id="mainGrpRow" style="margin-top:8px;display:none">
        <span style="color:#8a8479;font-size:12px">Main game: <span id="mainGrpName" style="color:var(--duke-yellow)"></span></span>
        <button class="s" id="btnUseShareware">Use shareware</button>
      </div>
      <div id="extraRow" style="margin-top:8px;display:none">
        <span style="color:#8a8479;font-size:12px">Stored extra data (stacked on the game at boot):</span>
        <ul id="extralist"></ul>
      </div>
      <input type="file" id="grpFile" multiple style="display:none">
    </section>
    <section>
      <h4>Display</h4>
      <div class="row">
        <button class="s" id="btnFull">Fullscreen</button>
        <button class="s" id="btn43">4:3</button>
        <button class="s" id="btnFill">Fill</button>
        <span>res</span>
        <input type="range" id="res" min="0" max="3" step="1" value="3">
        <span id="resLabel" style="width:58px;text-align:right"></span>
      </div>
    </section>
    <section>
      <label class="chk"><input type="checkbox" id="diagChk"> Diagnostics overlay</label>
    </section>
    <section>
      <button class="s danger" id="btnClear">Clear local data&hellip;</button>
    </section>
    <div class="foot">
      <span>classic 8-bit software renderer</span>
      <button id="btnClose">Close</button>
    </div>
  </div>
</div>
<script>
  var loaderEl = document.getElementById('loader'),
      fillEl   = document.getElementById('fill'),
      statusEl = document.getElementById('status'),
      errEl    = document.getElementById('err'),
      started  = false, hidden = false;

  function setPct(p){ fillEl.style.width = Math.max(0, Math.min(100, p)) + '%'; }
  function hideLoader(){ if (hidden) return; hidden = true; loaderEl.classList.add('hidden');
                         setTimeout(function(){ loaderEl.style.display='none'; }, 700); }

  // --- Aspect ratio: render at 4:3 and pillarbox the canvas with side margins ---
  var ASPECT = 4 / 3;
  function e32ResCap() { return parseInt(localStorage.getItem('e32_res') || '0', 10) || 0; }  // 0 = native
  function e32Fill()   { return localStorage.getItem('e32_display') === 'fill'; }
  function renderBox() {
    var W = window.innerWidth || 1280, H = window.innerHeight || 720, w, h;
    if (W / H > ASPECT) { h = H; w = Math.round(h * ASPECT); }   // window wider than 4:3 -> bars L/R
    else                { w = W; h = Math.round(w / ASPECT); }   // window taller than 4:3 -> bars top/bottom
    var cap = e32ResCap();                                       // optional render-height cap (Settings)
    if (cap && h > cap) { w = Math.round(w * cap / h); h = cap; }
    return { w: w & ~1, h: h & ~1 };
  }
  function fitCanvas() {
    var c = document.getElementById('canvas');
    if (e32Fill()) {   // stretch the 4:3 render to fill the window (no margins)
      if (c.style.width  !== '100vw') c.style.width  = '100vw';
      if (c.style.height !== '100vh') c.style.height = '100vh';
      return;
    }
    var b = renderBox();  // 4:3, centered -> black side margins
    if (c.style.width  !== b.w + 'px') c.style.width  = b.w + 'px';
    if (c.style.height !== b.h + 'px') c.style.height = b.h + 'px';
  }
  // Emscripten's SDL reads screen.width/height (the physical screen) as the render
  // resolution, so a browser window smaller than the screen renders at screen size
  // and gets squished into the window (wrong aspect). Report our 4:3 render box
  // instead, so the engine renders at the correct ratio; the page pillarboxes it.
  try {
    Object.defineProperty(window.screen, 'width',  { configurable: true, get: function(){ return renderBox().w; } });
    Object.defineProperty(window.screen, 'height', { configurable: true, get: function(){ return renderBox().h; } });
  } catch (e) {}

  // --- eduke32-net addition ---------------------------------------------------
  // Relaunch on a previously DOWNLOADED GRP (see window.DukeNet GRP transfer). The
  // player's persisted choice is localStorage['eduke32-net-gamegrp'] = {crc,filename};
  // absent => normal boot (bundled shareware), so this is a strict no-op for the
  // common case. Reads the verified GRP bytes straight from the same IndexedDB the
  // transport wrote them to (no dependency on the deferred net module being loaded
  // yet), writes them into FS, and appends -gamegrp. Fails safe to a normal boot.
  function applyNetGrpChoice() {
    var choice;
    try { choice = JSON.parse(localStorage.getItem('eduke32-net-gamegrp') || 'null'); } catch (e) { choice = null; }
    if (!choice || typeof choice.crc !== 'number') return;
    if (typeof indexedDB === 'undefined' || !Module.FS || !Module.addRunDependency) return;
    Module.addRunDependency('duke-net-grp');
    var done = function () { try { Module.removeRunDependency('duke-net-grp'); } catch (e) {} };
    try {
      var req = indexedDB.open('eduke32-net', 1);
      req.onerror = done;
      req.onsuccess = function () {
        var db = req.result;
        try {
          var g = db.transaction('grps', 'readonly').objectStore('grps').get(choice.crc >>> 0);
          g.onsuccess = function () {
            try {
              var rec = g.result;
              if (rec && rec.bytes && rec.filename) {
                Module.FS.writeFile('/' + rec.filename, rec.bytes);
                Module.arguments.push('-gamegrp', rec.filename);
              }
            } catch (e) {}
            try { db.close(); } catch (e) {}
            done();
          };
          g.onerror = function () { try { db.close(); } catch (e) {} done(); };
        } catch (e) { try { db.close(); } catch (e2) {} done(); }
      };
    } catch (e) { done(); }
  }
  // ---------------------------------------------------------------------------

  // ===========================================================================
  // LOCAL PERSISTENCE (browser MEMFS is wiped on reload)
  //
  //   settings (small text cfg files) -> localStorage
  //   extra game data / GRPs (multi-MB) -> IndexedDB
  //
  // On boot we copy both back into MEMFS BEFORE the engine reads them; at runtime
  // we mirror the engine's cfg writes out and let the Settings panel import GRPs.
  // Everything is best-effort: a disabled localStorage/IndexedDB (private mode) or
  // a full quota degrades to "no persistence", never a failed boot.
  //
  // In this build cwd stays "/" (the homedir ".config/eduke32" mkdir is non-recursive
  // and fails, so G_ExtPreInit never chdir()s), so the engine reads/writes these cfg
  // files at the MEMFS root -- which is exactly where we restore them.
  // ===========================================================================
  var E32_CFGS = ['eduke32.cfg', 'settings.cfg', 'm32_settings.cfg'];
  function e32CfgKey(name) { return 'eduke32/cfg/' + name; }

  // --- settings: restore, screen patch, write-mirror, unload backstop ---------

  // Copy persisted cfg text into MEMFS so the engine's startup read sees it.
  function e32RestoreConfigs() {
    E32_CFGS.forEach(function (name) {
      var v = null;
      try { v = localStorage.getItem(e32CfgKey(name)); } catch (e) {}
      if (v == null) return;
      try { Module.FS.writeFile('/' + name, v); } catch (e) {}
    });
  }

  // Force the render resolution to the current 4:3 box every boot (tracks window
  // size + the Settings res cap). Patch the restored eduke32.cfg IN PLACE rather
  // than clobbering the user's other settings; write a bare stub only on first boot.
  function e32ApplyScreenSetup() {
    var b = renderBox();
    var stub = '[Screen Setup]\nScreenMode = 0\nScreenWidth = ' + b.w + '\nScreenHeight = ' + b.h + '\nScreenBPP = 8\n';
    var cur = '';
    try { cur = Module.FS.readFile('/eduke32.cfg', { encoding: 'utf8' }); } catch (e) { cur = ''; }
    if (!cur) { try { Module.FS.writeFile('/eduke32.cfg', stub); } catch (e) {} return; }
    var setKey = function (text, key, val) {
      return text.replace(new RegExp('^([ \\t]*' + key + '[ \\t]*=[ \\t]*).*$', 'mi'), function (_, prefix) { return prefix + val; });
    };
    cur = setKey(cur, 'ScreenMode', 0);
    cur = setKey(cur, 'ScreenWidth', b.w);
    cur = setKey(cur, 'ScreenHeight', b.h);
    try { Module.FS.writeFile('/eduke32.cfg', cur); } catch (e) {}
  }

  // The engine writes cfg files via libc fopen/fwrite/fclose, which route through
  // Module.FS.close in this (non-WASMFS) build; wrap it so every completed write of
  // a known cfg is copied to localStorage. Catches the boot write, autosaves, manual
  // saves, and the quit-time flush. Installed AFTER the restore writes above so it
  // only ever fires on ENGINE writes, not on our own.
  function e32InstallCfgMirror() {
    try {
      var FS = Module.FS;
      if (!FS || FS.__e32cfgHooked) return;
      var origClose = FS.close.bind(FS);
      FS.close = function (stream) {
        var path = stream && stream.path;
        var writable = !!stream && (stream.flags & 3) !== 0; // O_WRONLY | O_RDWR
        var r = origClose(stream);
        try {
          if (path && writable) {
            var base = ('' + path).split('/').pop();
            if (E32_CFGS.indexOf(base) !== -1) {
              var data = FS.readFile(path, { encoding: 'utf8' });
              try { localStorage.setItem(e32CfgKey(base), data); } catch (e) {}
            }
          }
        } catch (e) {}
        return r;
      };
      FS.__e32cfgHooked = true;
    } catch (e) {}
  }

  // Backstop: snapshot the cfg files straight from MEMFS when the tab is hidden or
  // unloaded. CRITICAL ORDER: ask the ENGINE to flush first (Web_SaveConfig ->
  // CONFIG_WriteSetup(0), the full write including settings.cfg where the
  // sound/music cvars live) -- the engine otherwise never writes its config
  // in-session (G_Shutdown is unreachable in a browser), so snapshotting MEMFS
  // alone faithfully persisted a STALE boot-time file: that was the "settings
  // never save" bug. Synchronous: the engine write, the FS.close mirror, and
  // this snapshot all complete inside the event handler.
  function e32SnapshotConfigs() {
    var FS = window.Module && Module.FS;
    if (!FS) return;
    // NOTE: no Module.calledRun check -- this emscripten runtime never sets it
    // (verified live: it gated Web_SaveConfig off on every real pagehide, which
    // was the whole "settings still don't save" bug). The export existing means
    // the runtime is up; the engine's setupread guard makes early calls no-ops.
    try { if (Module._Web_SaveConfig) Module._Web_SaveConfig(); } catch (e) {}
    E32_CFGS.forEach(function (name) {
      var data;
      try { data = FS.readFile('/' + name, { encoding: 'utf8' }); } catch (e) { return; }
      if (data == null) return;
      try { localStorage.setItem(e32CfgKey(name), data); } catch (e) {}
    });
  }
  window.addEventListener('pagehide', e32SnapshotConfigs);
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') e32SnapshotConfigs(); });

  // --- extra game data (IndexedDB): store, restore, main-GRP preference --------

  var E32_UDB = 'eduke32-userdata';
  function e32OpenUserDb(onOpen, onErr) {
    try {
      if (typeof indexedDB === 'undefined') { onErr && onErr(); return; }
      var req = indexedDB.open(E32_UDB, 1);
      req.onupgradeneeded = function () {
        var db = req.result;
        if (!db.objectStoreNames.contains('files')) db.createObjectStore('files', { keyPath: 'name' }); // extra groups/mods
        if (!db.objectStoreNames.contains('main'))  db.createObjectStore('main',  { keyPath: 'id' });    // preferred registered main GRP
      };
      req.onsuccess = function () { onOpen(req.result); };
      req.onerror = function () { onErr && onErr(req.error); };
    } catch (e) { onErr && onErr(e); }
  }

  // CRC-32 (IEEE/zlib, poly 0xEDB88320) -- same as the engine's Bcrc32 and the net
  // layer's grp.ts, so values line up with grptable.ts / grpscan.cpp.
  var E32_CRC_TABLE = (function () {
    var t = new Uint32Array(256), n, k, c;
    for (n = 0; n < 256; n++) { c = n; for (k = 0; k < 8; k++) c = (c & 1) ? (0xedb88320 ^ (c >>> 1)) : (c >>> 1); t[n] = c >>> 0; }
    return t;
  })();
  function e32Crc32(bytes) {
    var c = 0xffffffff;
    for (var i = 0; i < bytes.length; i++) c = (c >>> 8) ^ E32_CRC_TABLE[(c ^ bytes[i]) & 0xff];
    return (c ^ 0xffffffff) >>> 0;
  }

  // Registered (non-shareware, non-add-on) DUKE base GRPs. CRCs mirrored from
  // platform/emscripten/net/grptable.ts (GRP_TABLE) -- keep in sync. Used to decide
  // whether an imported GRP should be remembered as the preferred main game.
  var E32_REGISTERED_DUKE_CRCS = [0xbbc9ce44, 0xaa4f6a40, 0xfd3dcff1, 0x982afe4a, 0xf514a6ac];
  function e32IsRegisteredDukeGrp(crc) { return E32_REGISTERED_DUKE_CRCS.indexOf(crc >>> 0) !== -1; }

  // Persist a generic extra group/mod (loaded on top of the base with -g on boot).
  function e32StoreUserFile(name, bytes, cb) {
    e32OpenUserDb(function (db) {
      try {
        var t = db.transaction('files', 'readwrite');
        t.objectStore('files').put({ name: name, bytes: bytes, size: bytes.length, savedAt: Date.now() });
        t.oncomplete = function () { try { db.close(); } catch (e) {} cb && cb(null); };
        t.onerror = function () { try { db.close(); } catch (e) {} cb && cb(t.error || new Error('put failed')); };
      } catch (e) { try { db.close(); } catch (e2) {} cb && cb(e); }
    }, function (e) { cb && cb(e || new Error('idb unavailable')); });
  }

  // Persist THE preferred registered main GRP (single record) and mark it in
  // localStorage so boot can prefer it without opening IndexedDB first.
  function e32StoreMainGrp(name, bytes, crc, cb) {
    e32OpenUserDb(function (db) {
      try {
        var t = db.transaction('main', 'readwrite');
        t.objectStore('main').put({ id: 'main', name: name, crc: crc >>> 0, size: bytes.length, bytes: bytes, savedAt: Date.now() });
        t.oncomplete = function () {
          try { db.close(); } catch (e) {}
          try { localStorage.setItem('eduke32/mainGrp', JSON.stringify({ crc: crc >>> 0, size: bytes.length, name: name })); } catch (e) {}
          cb && cb(null);
        };
        t.onerror = function () { try { db.close(); } catch (e) {} cb && cb(t.error || new Error('put failed')); };
      } catch (e) { try { db.close(); } catch (e2) {} cb && cb(e); }
    }, function (e) { cb && cb(e || new Error('idb unavailable')); });
  }

  // Forget the preferred main GRP -> next boot falls back to bundled shareware.
  function e32ClearMainGrp(cb) {
    try { localStorage.removeItem('eduke32/mainGrp'); } catch (e) {}
    e32OpenUserDb(function (db) {
      try {
        var t = db.transaction('main', 'readwrite');
        t.objectStore('main').delete('main');
        t.oncomplete = function () { try { db.close(); } catch (e) {} cb && cb(); };
        t.onerror = function () { try { db.close(); } catch (e) {} cb && cb(); };
      } catch (e) { try { db.close(); } catch (e2) {} cb && cb(); }
    }, function () { cb && cb(); });
  }

  // preRun: prefer a persisted registered main GRP over the bundled shareware.
  // Writes the stored bytes to a reserved MEMFS name (never collides with the
  // preloaded /DUKE3D.GRP) and selects it with -gamegrp. Defers to an active net
  // download choice (that path pushes its own -gamegrp). Falls back to shareware on
  // any error/missing blob. Gated by a run dependency so main() waits for it.
  function e32RestoreMainGrp() {
    var marker = null;
    try { marker = JSON.parse(localStorage.getItem('eduke32/mainGrp') || 'null'); } catch (e) { marker = null; }
    if (!marker) return;
    try { var nc = JSON.parse(localStorage.getItem('eduke32-net-gamegrp') || 'null'); if (nc && typeof nc.crc === 'number') return; } catch (e) {}
    if (typeof indexedDB === 'undefined' || !Module.FS || !Module.addRunDependency) return;
    Module.addRunDependency('e32-maingrp');
    var fired = false;
    var done = function () { if (fired) return; fired = true; try { Module.removeRunDependency('e32-maingrp'); } catch (e) {} };
    setTimeout(done, 8000); // never let a stuck IndexedDB stall boot
    e32OpenUserDb(function (db) {
      try {
        var g = db.transaction('main', 'readonly').objectStore('main').get('main');
        g.onsuccess = function () {
          try {
            var rec = g.result;
            if (rec && rec.bytes) {
              Module.FS.writeFile('/_e32_main.grp', rec.bytes);
              Module.arguments.push('-gamegrp', '_e32_main.grp');
            }
          } catch (e) {}
          try { db.close(); } catch (e) {}
          done();
        };
        g.onerror = function () { try { db.close(); } catch (e) {} done(); };
      } catch (e) { try { db.close(); } catch (e2) {} done(); }
    }, done);
  }

  // preRun (async, gated by a run dependency): load every stored EXTRA file into the
  // MEMFS root and queue group-type files for loading with -g. No-op / fail-safe when
  // IndexedDB is unavailable.
  //
  // BASE-GAME SHADOWING GUARD: -g groups override the main GRP's files, which is
  // the point for real mods -- but a stored TOTAL-CONVERSION/base GRP (e.g. an
  // unregistered 50MB GRP imported back when it WAS the game) stacked on a chosen
  // main game scrambles that game's data. Verified live: a stale TRUMPDUKE.GRP row
  // over imported Atomic turns the boot ANM into rainbow noise (its PALETTE/LOOKUP
  // shadow Atomic's). So: with a main game selected, base-game-SIZED groups
  // (>8 MB; real mods are smaller) are left un-stacked -- still stored, listed in
  // Settings with a Remove button, and stacked again if the main choice is cleared.
  function e32RestoreUserData() {
    if (typeof indexedDB === 'undefined' || !Module.FS || !Module.addRunDependency) return;
    var hasMain = false;
    try { hasMain = !!JSON.parse(localStorage.getItem('eduke32/mainGrp') || 'null'); } catch (e) {}
    try { var nc = JSON.parse(localStorage.getItem('eduke32-net-gamegrp') || 'null'); if (nc && typeof nc.crc === 'number') hasMain = true; } catch (e) {}
    Module.addRunDependency('e32-userdata');
    var fired = false;
    var done = function () { if (fired) return; fired = true; try { Module.removeRunDependency('e32-userdata'); } catch (e) {} };
    setTimeout(done, 8000); // never let a stuck IndexedDB stall boot
    e32OpenUserDb(function (db) {
      try {
        var all = db.transaction('files', 'readonly').objectStore('files').getAll();
        all.onsuccess = function () {
          try {
            (all.result || []).forEach(function (rec) {
              if (!rec || !rec.name || !rec.bytes) return;
              var isGroup = /\.(grp|zip|pk3|pk4)$/i.test(rec.name);
              if (hasMain && isGroup && rec.bytes.length > 8 * 1024 * 1024) {
                console.log('[e32] NOT stacking stored "' + rec.name + '" (base-game-sized; it would shadow the selected main game\'s data -- remove it in Settings if unwanted)');
                return;
              }
              try { Module.FS.writeFile('/' + rec.name, rec.bytes); } catch (e) {}
              if (isGroup) { try { Module.arguments.push('-g', rec.name); console.log('[e32] stacking stored extra "' + rec.name + '"'); } catch (e) {} }
            });
          } catch (e) {}
          try { db.close(); } catch (e) {}
          done();
        };
        all.onerror = function () { try { db.close(); } catch (e) {} done(); };
      } catch (e) { try { db.close(); } catch (e2) {} done(); }
    }, done);
  }
  // ===========================================================================

  window.__BUILD__ = "__BUILD_ID__";  // replaced at deploy time (CI 'Assemble site'); cache-buster + on-page build tag

  // STALE-PAGE SELF-HEAL. GitHub Pages serves everything with max-age=600 and a
  // plain navigation within that window gets the CACHED document -- no request at
  // all -- so a player can sit a full build behind while a deploy is "live" (every
  // asset is ?v=-busted, but only off a fresh document). Revalidate the document at
  // boot; if the server's copy names a different build, reload once (sessionStorage
  // guard: never loops). Costs one conditional request; incognito behavior and a
  // fresh cache are unaffected.
  (function () {
    try {
      fetch(location.pathname, { cache: 'no-cache' }).then(function (r) { return r.text(); }).then(function (t) {
        var m = t.match(/__BUILD__ = "([^"]+)"/);
        if (!m || m[1] === window.__BUILD__) return;
        var key = 'e32-reloaded-' + m[1];
        if (sessionStorage.getItem(key)) return;
        sessionStorage.setItem(key, '1');
        location.reload();
      }).catch(function () {});
    } catch (e) {}
  })();
  var Module = {
    canvas: (function(){ var c = document.getElementById('canvas');
      c.addEventListener('webglcontextlost', function(e){ alert('WebGL context lost.'); e.preventDefault(); }, false);
      return c; })(),
    arguments: (function () {
      var a = ['-nosetup'];
      // ?join= / ?bot= flows go straight to work: skip the logo/title crawl.
      var q = new URLSearchParams(location.search);
      if (q.get('join') || q.get('bot') === '1') a.push('-nologo');
      return a;
    })(),
    // Cache-bust the wasm with the deploy build id so a fresh deploy is never served
    // from a stale browser/CDN cache. The 11 MB .data is intentionally NOT busted
    // (rarely changes; busting it would re-download the whole pack every deploy).
    locateFile: function (path, prefix) {
      return prefix + path + (path.slice(-5) === '.wasm' ? '?v=' + window.__BUILD__ : '');
    },
    // Emscripten calls setStatus for wasm/data download + init. "(x/y)" carries bytes.
    setStatus: function (text) {
      if (!text) { setPct(100); statusEl.textContent = 'Starting…'; if (started) hideLoader(); return; }
      var m = text.match(/([\d.]+)\s*\/\s*([\d.]+)/);
      if (m) { setPct(100 * parseFloat(m[1]) / parseFloat(m[2])); statusEl.textContent = 'Downloading game data…'; }
      else   { statusEl.textContent = text; }
    },
    monitorRunDependencies: function (left) {
      if (left === 0) { setPct(100); statusEl.textContent = 'Starting…'; }
    },
    onRuntimeInitialized: function () { started = true; fitCanvas(); document.getElementById('gear').style.display = 'flex'; document.getElementById('mute').style.display = 'flex'; setTimeout(hideLoader, 400); },
    printErr: function (t) {
      console.error(t);
      if (!window.__e32ver) { var m = /EDuke32\s+\S+/.exec(t); if (m) { window.__e32ver = m[0]; var v = document.getElementById('ver'); if (v) v.textContent = m[0]; } }
    },
    preRun: [function () {
      // Restore persisted settings into MEMFS, then windowed at the 4:3 render box
      // (the screen override above makes the engine render at this resolution;
      // fitCanvas() centers it with side margins), then start mirroring the engine's
      // config writes back to localStorage. Order matters: restore + screen patch run
      // BEFORE the mirror hook so they don't echo our own writes back out.
      e32RestoreConfigs();
      e32ApplyScreenSetup();
      e32InstallCfgMirror();
    },
    // eduke32-net addition: apply a downloaded GRP choice before the engine runs.
    applyNetGrpChoice,
    // Prefer a persisted registered/Atomic main GRP over the bundled shareware.
    e32RestoreMainGrp,
    // Restore user-imported extra game-data files (GRPs/mods) from IndexedDB.
    e32RestoreUserData]
  };
  window.onerror = function (msg) { errEl.textContent = String(msg); };

  // Web Audio starts suspended until a user gesture; unlock on first interaction.
  function unlockAudio() {
    var sdl = Module.SDL2, ctx = sdl && sdl.audioContext;
    if (!ctx) return;
    if (ctx.resume) ctx.resume();
    var node = sdl.audio && sdl.audio.scriptProcessorNode;
    if (node && !unlockAudio.done) { unlockAudio.done = true; try { node.disconnect(); node.connect(ctx.destination); } catch (e) {} }
  }
  ['pointerdown', 'keydown', 'touchend'].forEach(function (t) { window.addEventListener(t, unlockAudio); });
  // Mouselook needs relative motion (Pointer Lock); grab it on click.
  document.getElementById('canvas').addEventListener('click', function () {
    if (document.pointerLockElement !== this) this.requestPointerLock();
  });

  // Keep the 4:3 letterbox: on resize, and whenever SDL sets the canvas backing
  // size/style at video-mode init, re-apply the centered display size.
  fitCanvas();
  window.addEventListener('resize', fitCanvas);

  // ?join=CODE[&name=NAME][&bot=1] — auto-join a match by invite code on boot.
  // Doubles as a shareable invite link and as swarm-test plumbing (N pages
  // piling into one match). bot=1 arms Web_SetLocalBot: this peer plays
  // itself via the engine's bot brain through the full human input pipeline.
  (function () {
    var qs = new URLSearchParams(location.search);
    var code = qs.get('join');
    var isBot = qs.get('bot') === '1';
    if (!code && !isBot) return;
    var name = qs.get('name') || ('Link' + Math.floor(Math.random() * 900 + 100));
    // The join takes seconds (relay lookup + WebRTC dial) and used to give NO
    // feedback -- a failure looked like "the link does nothing" (live-reported
    // twice). Reuse the boot loader as a status banner: every net-layer status
    // lands on it, errors stay visible, and lookup errors retry a few times.
    var banner = function (text) {
      statusEl.textContent = text;
      hidden = false; loaderEl.style.display = ''; loaderEl.classList.remove('hidden');
    };
    var joinTries = 0;
    var joined = false;
    window.addEventListener('duke-net-status', function (ev) {
      if (!code || joined) return;
      var s = String(ev.detail || '');
      if (/^Joined|^In game/i.test(s)) { joined = true; hideLoader(); return; }
      if (s.charAt(0) === '!') {
        console.error('[join] ' + s);
        if (++joinTries <= 3) {
          banner('Join failed (' + s.slice(1) + ') — retrying ' + joinTries + '/3…');
          setTimeout(function () { try { window.NetMenu.joinCode(code, name); } catch (e) { banner('Join error: ' + e); } }, 4000);
        } else {
          banner('Could not join ' + code + ': ' + s.slice(1));
        }
        return;
      }
      banner(s);
    });
    var tries = 0;
    var t = setInterval(function () {
      if (++tries > 240) { clearInterval(t); if (code) banner('Join never started: the net layer did not come up (hard-refresh?)'); return; }
      if (!started) return;
      if (code && !(window.NetMenu && window.NetMenu.joinCode)) return;
      clearInterval(t);
      if (isBot) { try { Module.ccall('Web_SetLocalBot', null, ['number'], [1]); } catch (e) { console.error('[join] bot arm failed', e); } }
      if (code) {
        banner('Joining match ' + code + '…');
        try { window.NetMenu.joinCode(code, name); } catch (e) { console.error('[join]', e); banner('Join error: ' + e); }
      }
    }, 500);
  })();
  new MutationObserver(fitCanvas).observe(document.getElementById('canvas'),
    { attributes: true, attributeFilter: ['width', 'height', 'style'] });

  // ---------------- Web-wrapper settings panel (not the in-game menu) ----------------
  (function () {
    var RES_STEPS = [480, 720, 1080, 0];            // slider index -> render-height cap (0 = Native)
    var RES_NAMES = ['480p', '720p', '1080p', 'Native'];
    var $ = function (id) { return document.getElementById(id); };
    var settingsEl = $('settings'), gearEl = $('gear'), diagEl = $('diag');

    function open()  { populateGRPs(); populateExtras(); syncMainGrp(); syncControls(); settingsEl.classList.add('open'); try { document.exitPointerLock(); } catch (e) {} }
    function close() { settingsEl.classList.remove('open'); }

    function hsize(n) { return n >= 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.round(n / 1024) + ' KB'; }
    var KNOWN_GRP = { 11035779: 'Duke Nukem 3D Shareware 1.3D', 44356548: 'Duke Nukem 3D Atomic Edition' };

    // List every .GRP the engine has in its in-memory filesystem.
    function scanGRPs() {
      var out = [];
      try {
        var FS = Module.FS;
        ['/', '/data'].forEach(function (dir) {
          var names; try { names = FS.readdir(dir); } catch (e) { return; }
          names.forEach(function (n) {
            if (!/\.grp$/i.test(n)) return;
            var p = (dir === '/' ? '' : dir) + '/' + n, sz = 0;
            try { sz = FS.stat(p).size; } catch (e) {}
            out.push({ name: n, size: sz, id: KNOWN_GRP[sz] || null });
          });
        });
      } catch (e) {}
      return out;
    }
    function populateGRPs() {
      var ul = $('grplist'), grps = scanGRPs();
      ul.innerHTML = '';
      if (!grps.length) { ul.innerHTML = '<li class="empty">No GRP files loaded.</li>'; return; }
      grps.forEach(function (g) {
        var li = document.createElement('li');
        li.innerHTML = '<span class="gname">' + g.name + (g.id ? ' <span class="gid">' + g.id + '</span>' : '') + '</span>' +
                       '<span class="gsz">' + hsize(g.size) + '</span>';
        ul.appendChild(li);
      });
    }

    // Stored EXTRA files (IndexedDB 'files' store) -- everything here is written
    // into the FS at boot and group-type files are stacked with -g. Invisible
    // residue in this store is how a long-forgotten total-conversion GRP silently
    // corrupted the imported main game, so it gets a visible list with per-file
    // Remove buttons.
    function e32DeleteUserFile(name, cb) {
      e32OpenUserDb(function (db) {
        try {
          var t = db.transaction('files', 'readwrite');
          t.objectStore('files').delete(name);
          t.oncomplete = function () { try { db.close(); } catch (e) {} cb && cb(); };
          t.onerror = function () { try { db.close(); } catch (e) {} cb && cb(); };
        } catch (e) { try { db.close(); } catch (e2) {} cb && cb(); }
      }, function () { cb && cb(); });
    }
    function populateExtras() {
      var ul = $('extralist'), row = $('extraRow');
      if (!ul || !row) return;
      e32OpenUserDb(function (db) {
        var all;
        try { all = db.transaction('files', 'readonly').objectStore('files').getAll(); }
        catch (e) { try { db.close(); } catch (e2) {} return; }
        all.onsuccess = function () {
          try { db.close(); } catch (e) {}
          var recs = all.result || [];
          ul.innerHTML = '';
          row.style.display = recs.length ? 'block' : 'none';
          recs.forEach(function (rec) {
            if (!rec || !rec.name) return;
            var li = document.createElement('li');
            var nm = document.createElement('span'); nm.className = 'gname'; nm.textContent = rec.name;
            var sz = document.createElement('span'); sz.className = 'gsz';
            sz.textContent = hsize(rec.size || (rec.bytes ? rec.bytes.length : 0));
            var rm = document.createElement('button'); rm.className = 's'; rm.textContent = 'Remove';
            rm.addEventListener('click', function () {
              if (!confirm('Remove stored "' + rec.name + '"? It will no longer be loaded at boot (reload to apply).')) return;
              e32DeleteUserFile(rec.name, populateExtras);
            });
            li.appendChild(nm); li.appendChild(sz); li.appendChild(rm);
            ul.appendChild(li);
          });
        };
        all.onerror = function () { try { db.close(); } catch (e) {} };
      }, function () {});
    }

    function syncControls() {
      var fill = e32Fill();
      $('btn43').classList.toggle('on', !fill);
      $('btnFill').classList.toggle('on', fill);
      var cap = e32ResCap(), idx = RES_STEPS.indexOf(cap); if (idx < 0) idx = 3;
      $('res').value = idx; $('resLabel').textContent = RES_NAMES[idx];
      $('diagChk').checked = localStorage.getItem('e32_diag') === '1';
    }

    function setDisplay(mode) { localStorage.setItem('e32_display', mode); fitCanvas(); syncControls(); }

    // Diagnostics overlay: browser frame rate + render size + engine build.
    var diagOn = false, frames = 0, lastT = 0, raf = 0;
    function diagLoop(t) {
      if (!diagOn) return;
      frames++;
      if (!lastT) lastT = t;
      if (t - lastT >= 500) {
        var fps = Math.round(frames * 1000 / (t - lastT)); frames = 0; lastT = t;
        var c = $('canvas');
        diagEl.textContent = fps + ' fps  ' + c.width + 'x' + c.height + (window.__e32ver ? '  ' + window.__e32ver : '') + (window.__BUILD__ ? '  build ' + window.__BUILD__ : '');
      }
      raf = requestAnimationFrame(diagLoop);
    }
    function setDiag(on) {
      diagOn = on; localStorage.setItem('e32_diag', on ? '1' : '0');
      diagEl.style.display = on ? 'block' : 'none';
      cancelAnimationFrame(raf);
      if (on) { frames = 0; lastT = 0; raf = requestAnimationFrame(diagLoop); }
    }

    function clearData() {
      if (!confirm('Clear saved settings and local data, then reload?')) return;
      try { localStorage.clear(); } catch (e) {}
      var done = function () { location.reload(); };
      try {
        if (window.indexedDB && indexedDB.databases) {
          indexedDB.databases().then(function (dbs) {
            (dbs || []).forEach(function (d) { if (d.name) indexedDB.deleteDatabase(d.name); });
            setTimeout(done, 250);
          }, done);
        } else done();
      } catch (e) { done(); }
    }

    gearEl.addEventListener('click', open);
    $('btnClose').addEventListener('click', close);
    settingsEl.addEventListener('click', function (e) { if (e.target === settingsEl) close(); });   // click backdrop
    $('btn43').addEventListener('click', function () { setDisplay('4:3'); });
    $('btnFill').addEventListener('click', function () { setDisplay('fill'); });
    $('btnFull').addEventListener('click', function () {
      var el = document.documentElement;
      if (document.fullscreenElement) { (document.exitFullscreen || function(){}).call(document); }
      else { (el.requestFullscreen || el.webkitRequestFullscreen || function(){}).call(el); }
    });
    $('res').addEventListener('input', function () { $('resLabel').textContent = RES_NAMES[+this.value]; });
    $('res').addEventListener('change', function () {
      var cap = RES_STEPS[+this.value];
      if (cap === e32ResCap()) return;
      localStorage.setItem('e32_res', String(cap));
      // The engine reads the render resolution once at boot, so reload to apply it.
      location.reload();
    });
    $('diagChk').addEventListener('change', function () { setDiag(this.checked); });
    $('btnClear').addEventListener('click', clearData);

    // Show/hide the "Main game: <name>  [Use shareware]" row from the persisted
    // registered-GRP marker (see e32StoreMainGrp / e32RestoreMainGrp).
    function syncMainGrp() {
      var row = $('mainGrpRow'), marker = null;
      try { marker = JSON.parse(localStorage.getItem('eduke32/mainGrp') || 'null'); } catch (e) {}
      if (marker && marker.name) {
        $('mainGrpName').textContent = (KNOWN_GRP[marker.size] || marker.name);
        row.style.display = 'flex';
      } else row.style.display = 'none';
    }
    $('btnUseShareware').addEventListener('click', function () {
      if (!confirm('Revert to the shareware game and reload?')) return;
      e32ClearMainGrp(function () { location.reload(); });
    });

    // Import extra game data (GRPs / mods): write into the engine FS now and persist
    // for next boot. A registered/Atomic DUKE3D.GRP is remembered as the main game
    // (IndexedDB 'main' + localStorage marker); anything else is stored as an extra
    // group loaded with -g. Takes effect on the next reload.
    var grpFileEl = $('grpFile'), grpAddNote = $('grpAddNote');
    $('btnAddGrp').addEventListener('click', function () { grpFileEl.click(); });
    grpFileEl.addEventListener('change', function () {
      var files = Array.prototype.slice.call(grpFileEl.files || []);
      grpFileEl.value = '';
      if (!files.length) return;
      grpAddNote.textContent = 'Saving…';
      var pending = files.length, failed = 0, mainLabel = null;
      var finish = function () {
        populateGRPs(); syncMainGrp();
        grpAddNote.textContent = (failed ? failed + ' failed; ' : '') +
          (mainLabel ? 'Saved ' + mainLabel + ' as the main game. ' : '') + 'Reload to load new game data.';
      };
      files.forEach(function (f) {
        var rd = new FileReader();
        rd.onload = function () {
          var bytes = new Uint8Array(rd.result);
          var crc = 0; try { crc = e32Crc32(bytes); } catch (e) {}
          var cb = function (err) { if (err) failed++; if (--pending === 0) finish(); };
          if (/\.grp$/i.test(f.name) && e32IsRegisteredDukeGrp(crc)) {
            mainLabel = KNOWN_GRP[bytes.length] || f.name;
            e32StoreMainGrp(f.name, bytes, crc, cb);           // preferred main game
          } else {
            try { Module.FS.writeFile('/' + f.name, bytes); } catch (e) {}
            e32StoreUserFile(f.name, bytes, cb);               // extra group / mod
          }
        };
        rd.onerror = function () { failed++; if (--pending === 0) finish(); };
        rd.readAsArrayBuffer(f);
      });
    });

    // Esc closes the panel (before the game sees it) when the panel is open.
    window.addEventListener('keydown', function (e) {
      if (settingsEl.classList.contains('open') && e.key === 'Escape') { close(); e.preventDefault(); e.stopPropagation(); }
    }, true);

    if (localStorage.getItem('e32_diag') === '1') setDiag(true);
    syncControls();
  })();
</script>
<!-- eduke32-net addition: the WebRTC+Nostr multiplayer transport (window.DukeNet).
     A deferred, self-contained ES module built by platform/emscripten esbuild;
     independent of the wasm graph. Must be served beside eduke32.js. -->
<script>
// Mute toggle (persisted): drives the ENGINE's own Sound/Music toggles via the
// exported Web_SetMute -- the exact state the Sound Setup menu flips -- so every
// FX and music path is silenced at the source. (The old audio-context suspend was
// a workaround the engine's autoplay-unlock kept fighting: some actions still
// made sound.) Unmute restores the user's real Sound/Music settings, not blanket ON.
(function () {
  var btn = document.getElementById('mute');
  if (!btn) return;
  var muted = false;
  try { muted = localStorage.getItem('e32-muted') === '1'; } catch (e) {}
  // Gate on the EXPORT, not window.__e32menu: that harness surface silently died
  // once (buffer truncation -> JS syntax error) and took the mute button with it.
  // Web_SetMute is safe any time after the runtime is up.
  function ready() { return !!(window.Module && Module.ccall && Module._Web_SetMute); }
  function paint() { btn.innerHTML = muted ? '&#128263;' : '&#128266;'; btn.classList.toggle('muted', muted); }
  function apply() {
    if (ready()) { try { Module.ccall('Web_SetMute', null, ['number'], [muted ? 1 : 0]); } catch (e) {} }
    paint();
  }
  btn.addEventListener('click', function () {
    muted = !muted;
    try { localStorage.setItem('e32-muted', muted ? '1' : '0'); } catch (e) {}
    apply();
  });
  paint();
  // __e32menu appears once the engine's menu loop runs (config loaded) -- the
  // earliest point the toggles safely stick. Re-assert the persisted state then.
  var boot = setInterval(function () { if (ready()) { clearInterval(boot); if (muted) apply(); } }, 500);
})();
</script>
<script type="module" src="eduke32-net.js?v=__BUILD_ID__"></script>
<script src="eduke32.js?v=__BUILD_ID__"></script>
</body>
